openapi: 3.1.0
info:
  title: Rescue-AI
  description: ML-powered aerial search & rescue system. Processes drone video frames
    in real-time, detects people using YOLOv8, and generates alerts for rescue operators.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Liveness check
      description: Returns 200 if the service process is running.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - system
      summary: Readiness check
      description: 'Checks that all required integrations (database, S3, RPi) are
        configured.


        Returns 503 with a per-subsystem breakdown if any check fails.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more subsystems not configured
  /rpi/status:
    get:
      tags:
      - system
      summary: RPi connectivity
      description: Ping the Raspberry Pi device and report whether it is reachable.
      operationId: rpi_status_rpi_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpiStatusResponse'
  /rpi/missions:
    get:
      tags:
      - system
      summary: List RPi missions
      description: Fetch the catalog of recorded missions available on the RPi device.
      operationId: rpi_missions_rpi_missions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Rpi Missions Rpi Missions Get
        '503':
          description: RPi device unavailable
  /missions/start:
    post:
      tags:
      - missions
      summary: Start a new mission
      description: 'Create a mission, connect to the RPi video stream, and begin

        real-time person detection with YOLOv8.'
      operationId: start_mission_missions_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStartResponse'
        '404':
          description: RPi mission not found
        '409':
          description: Another mission is already running
        '503':
          description: Detector or RPi stream unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/stop-stream:
    post:
      tags:
      - missions
      summary: Stop video stream
      description: 'Stop the RPi video stream but keep the mission open so the

        operator can continue reviewing pending alerts.'
      operationId: stop_mission_stream_missions__mission_id__stop_stream_post
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopStreamResponse'
        '404':
          description: Mission not found
        '409':
          description: Mission is not running
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/complete:
    post:
      tags:
      - missions
      summary: Complete mission
      description: 'Finalize the mission, stop the stream if still running, generate

        the quality report, and upload it to S3.


        Fails with 409 if there are unreviewed (queued) alerts.'
      operationId: complete_mission_missions__mission_id__complete_post
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionCompleteResponse'
        '404':
          description: Mission not found
        '409':
          description: Unreviewed alerts remain or already completed
        '502':
          description: Storage operation failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/force-complete:
    post:
      tags:
      - missions
      summary: Force-complete mission
      description: 'Emergency completion: automatically rejects all pending alerts

        and finalizes the mission.


        Use when the operator cannot review every alert individually.'
      operationId: force_complete_mission_missions__mission_id__force_complete_post
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceCompleteRequest'
              default:
                reviewed_by: "\u0430\u0432\u0442\u043E-\u043E\u0431\u0445\u043E\u0434"
                decision_reason: "\u0430\u0432\u0430\u0440\u0438\u0439\u043D\u043E\
                  \u0435 \u0441\u043D\u044F\u0442\u0438\u0435 \u0437\u0430\u0432\u0438\
                  \u0441\u0448\u0435\u0439 \u043E\u0447\u0435\u0440\u0435\u0434\u0438"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceCompleteResponse'
        '404':
          description: Mission not found
        '409':
          description: Could not resolve alerts or already completed
        '502':
          description: Storage operation failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/stream/status:
    get:
      tags:
      - missions
      summary: Stream status
      description: 'Return the current state of the video processing stream:

        running/stopped, processed frames, detection counters.'
      operationId: get_mission_stream_status_missions__mission_id__stream_status_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Mission Stream Status Missions  Mission Id  Stream
                  Status Get
        '404':
          description: Mission not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/trajectory:
    get:
      tags:
      - missions
      summary: Get live operator trajectory
      description: Return trajectory points produced while the operator stream runs.
      operationId: get_mission_trajectory_missions__mission_id__trajectory_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionTrajectoryResponse'
        '404':
          description: Mission not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}/report:
    get:
      tags:
      - missions
      summary: Get mission report
      description: 'Return the quality report for a mission: detection statistics,

        alert counts, and KPI metrics (recall, false-positive rate, etc.).'
      operationId: get_mission_report_missions__mission_id__report_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Mission Report Missions  Mission Id  Report Get
        '404':
          description: Mission not found
        '502':
          description: Storage operation failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts:
    get:
      tags:
      - alerts
      summary: List alerts
      description: 'List alerts with optional filters by mission and review status

        (queued, reviewed_confirmed, reviewed_rejected).'
      operationId: get_alerts_alerts_get
      parameters:
      - name: mission_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Mission Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
                title: Response Get Alerts Alerts Get
        '404':
          description: Mission not found (if filtered)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts/{alert_id}:
    get:
      tags:
      - alerts
      summary: Get alert details
      description: 'Return full details of a single alert: detection bounding boxes,

        confidence scores, review status, and timing information.'
      operationId: get_alert_details_alerts__alert_id__get
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Alert not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts/{alert_id}/frame:
    get:
      tags:
      - alerts
      summary: Download alert frame
      description: Download the original video frame (JPEG) that triggered the alert.
      operationId: get_alert_frame_alerts__alert_id__frame_get
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      responses:
        '200':
          description: Frame image
          content:
            application/json:
              schema: {}
            image/jpeg: {}
        '404':
          description: Alert or frame not found
        '502':
          description: Storage operation failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts/{alert_id}/confirm:
    post:
      tags:
      - alerts
      summary: Confirm alert
      description: "Mark the alert as a true positive \u2014 a person was indeed detected."
      operationId: confirm_alert_alerts__alert_id__confirm_post
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
              default:
                reviewed_by: "\u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Alert not found
        '409':
          description: Alert already reviewed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts/{alert_id}/reject:
    post:
      tags:
      - alerts
      summary: Reject alert
      description: "Mark the alert as a false positive \u2014 no real person in the\
        \ frame."
      operationId: reject_alert_alerts__alert_id__reject_post
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
              default:
                reviewed_by: "\u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Alert not found
        '409':
          description: Alert already reviewed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /predict:
    post:
      tags:
      - detection
      summary: Single-frame detection
      description: 'Run YOLOv8 person detection on a single image.


        Accepts a local file path or an S3 URI. Returns a list of

        detected objects with bounding boxes and confidence scores.'
      operationId: predict_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '404':
          description: Frame not found in S3
        '502':
          description: Detection failed
        '503':
          description: Detector or storage not available
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/start:
    post:
      tags:
      - auto-missions
      summary: Start an automatic mission
      description: Create and start a new automatic mission.
      operationId: start_auto_mission_auto_missions_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoMissionStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoMissionResponse'
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/{mission_id}/ingest:
    post:
      tags:
      - auto-missions
      summary: Ingest one frame
      description: Process one frame of an automatic mission.
      operationId: ingest_auto_mission_frame_auto_missions__mission_id__ingest_post
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_auto_mission_frame_auto_missions__mission_id__ingest_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoFrameResponse'
        '404':
          description: Mission not found
        '409':
          description: Mission is not an automatic mission or is completed
        '415':
          description: Uploaded file is not an image
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/{mission_id}/complete:
    post:
      tags:
      - auto-missions
      summary: Complete an automatic mission
      description: Finalize an automatic mission and persist the report + trajectory
        plot.
      operationId: complete_auto_mission_auto_missions__mission_id__complete_post
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      - name: completed_frame_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed Frame Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoMissionCompleteResponse'
        '404':
          description: Mission not found
        '502':
          description: Storage operation failed
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/{mission_id}/report:
    get:
      tags:
      - auto-missions
      summary: Get automatic-mission report
      description: Return the ``report.json`` summary for a completed automatic mission.
      operationId: get_auto_mission_report_auto_missions__mission_id__report_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Auto Mission Report Auto Missions  Mission Id  Report
                  Get
        '404':
          description: Mission not found or not completed
        '502':
          description: Storage operation failed
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/{mission_id}/trajectory-plot.png:
    get:
      tags:
      - auto-missions
      summary: Download trajectory plot PNG
      description: Serve the rendered ``plots/trajectory.png`` for an automatic mission.
      operationId: get_auto_mission_trajectory_plot_auto_missions__mission_id__trajectory_plot_png_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Mission or plot not found
        '502':
          description: Storage operation failed
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-missions/{mission_id}/trajectory.csv:
    get:
      tags:
      - auto-missions
      summary: Download trajectory CSV
      description: Serve the persisted ``trajectory.csv`` for an automatic mission.
      operationId: get_auto_mission_trajectory_csv_auto_missions__mission_id__trajectory_csv_get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Mission or trajectory CSV not found
        '502':
          description: Storage operation failed
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-sessions/start:
    post:
      tags:
      - auto-sessions
      summary: Start a new automatic-mode session
      description: Create an automatic mission and start streaming frames.
      operationId: start_auto_session_auto_sessions_start_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSessionStartResponse'
        '400':
          description: Invalid source
        '409':
          description: Another automatic session is already running
        '413':
          description: Upload too large
        '503':
          description: Automatic mode not configured
  /s3-missions:
    get:
      tags:
      - auto-sessions
      summary: List missions archived in S3 (re-runnable from the cloud)
      description: "Return ``{ds, mission_id}`` entries for every mission stored in\
        \ S3.\n\nPowers the operator UI \"\u0418\u0437 \u043E\u0431\u043B\u0430\u043A\
        \u0430\" picker. Returns an empty list (not an\nerror) when S3 is not configured\
        \ so the UI degrades gracefully."
      operationId: list_cloud_missions_s3_missions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response List Cloud Missions S3 Missions Get
  /auto-sessions/{session_id}/stop:
    post:
      tags:
      - auto-sessions
      summary: Stop an automatic-mode session
      description: Signal the session to stop and wait for it to drain.
      operationId: stop_auto_session_auto_sessions__session_id__stop_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSessionStopResponse'
        '404':
          description: Session not found
        '503':
          description: Automatic mode not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auto-sessions/active:
    get:
      tags:
      - auto-sessions
      summary: Describe the currently active automatic session (if any)
      description: Return descriptor + running counters for the active session.
      operationId: get_active_auto_session_auto_sessions_active_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSessionActiveResponse'
        '503':
          description: Automatic mode not configured
components:
  schemas:
    AlertResponse:
      properties:
        alert_id:
          type: string
          title: Alert Id
          description: Unique alert identifier
        mission_id:
          type: string
          title: Mission Id
          description: Parent mission identifier
        frame_id:
          type: integer
          title: Frame Id
          description: Frame index that triggered alert
        ts_sec:
          type: number
          title: Ts Sec
          description: Timestamp offset in seconds
        alert_time_iso:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Time Iso
          description: Absolute alert time in ISO 8601
        has_frame:
          type: boolean
          title: Has Frame
          description: Whether the original frame is available for download
        people_detected:
          type: integer
          title: People Detected
          description: Number of people detected
        bbox:
          items:
            type: number
          type: array
          title: Bbox
          description: Primary detection bounding box [x1, y1, x2, y2]
        bboxes:
          items:
            items:
              type: number
            type: array
          type: array
          title: Bboxes
          description: All detection bounding boxes
        scores:
          items:
            type: number
          type: array
          title: Scores
          description: Confidence scores for all detections
        score:
          type: number
          title: Score
          description: Primary detection confidence
        label:
          type: string
          title: Label
          description: Detected class
          examples:
          - person
        model_name:
          type: string
          title: Model Name
          description: Model name
          examples:
          - yolo8n
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
          description: Optional model explanation
        status:
          type: string
          title: Status
          description: Review status
          examples:
          - queued
          - reviewed_confirmed
          - reviewed_rejected
        reviewed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed By
          description: Reviewer identifier
      type: object
      required:
      - alert_id
      - mission_id
      - frame_id
      - ts_sec
      - alert_time_iso
      - has_frame
      - people_detected
      - bbox
      - bboxes
      - scores
      - score
      - label
      - model_name
      - explanation
      - status
      - reviewed_by
      title: AlertResponse
      description: Alert details returned by list and detail endpoints.
    AutoFrameAlertItem:
      properties:
        alert_id:
          type: string
          title: Alert Id
        frame_id:
          type: integer
          title: Frame Id
        ts_sec:
          type: number
          title: Ts Sec
        people_detected:
          type: integer
          title: People Detected
        score:
          type: number
          title: Score
        label:
          type: string
          title: Label
        image_uri:
          type: string
          title: Image Uri
      type: object
      required:
      - alert_id
      - frame_id
      - ts_sec
      - people_detected
      - score
      - label
      - image_uri
      title: AutoFrameAlertItem
      description: Alert emitted while ingesting a frame.
    AutoFrameDecisionItem:
      properties:
        decision_id:
          type: string
          title: Decision Id
        kind:
          type: string
          title: Kind
        reason:
          type: string
          title: Reason
        ts_sec:
          type: number
          title: Ts Sec
        frame_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frame Id
