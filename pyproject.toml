[project]
name = "rescue-ai"
version = "0.1.0"
requires-python = ">=3.12"
# Минимальное ядро, разделяемое всеми сервисами через rescue_ai.config /
# rescue_ai.domain / rescue_ai.application.metrics. Всё, что специфично
# для конкретного микросервиса, выведено в optional-dependencies ниже.
dependencies = [
  "pydantic>=2,<3",
  "pydantic-settings==2.7.1",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
# ── Микросервисные extras (по одному на образ из Dockerfile) ────────
#
# Каждый extra описывает рантайм-зависимости одного pod'а. Образы
# собираются независимо: detection не тянет fastapi-routes API,
# nav-engine не тянет torch, batch-exporter не тянет boto3 и т.д.
# Это и есть честный «образ детекции содержит только зависимости
# детекции».
api = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",
  "python-multipart>=0.0.9",
  "PyYAML==6.0.2",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "psycopg[binary]==3.2.3",
  "boto3==1.42.65",
  # Server-side trajectory PNG renderer (MatplotlibTrajectoryPlotRenderer).
  "matplotlib>=3.8,<4",
]
detection = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "PyYAML==6.0.2",
  "ultralytics==8.3.57",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ncnn>=1.0.20240820",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]
nav-engine = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]
sync-worker = [
  "boto3==1.42.65",
  "psycopg[binary]==3.2.3",
  "httpx==0.27.2",
  "PyYAML==6.0.2",
]
batch-worker = [
  "boto3==1.42.65",
  "psycopg[binary]==3.2.3",
  "PyYAML==6.0.2",
  "ultralytics==8.3.57",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ncnn>=1.0.20240820",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]
batch-exporter = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "psycopg[binary]==3.2.3",
]

# ── Инфраструктурные extras (не для образов сервисов) ───────────────
#
# Airflow используется только как стоковый образ apache/airflow в k8s
# (см. infra/k8s/values/*.yaml). Этот extra нужен для локального
# `python -c "import airflow"` и для линтинга DAG-файлов в CI.
airflow = [
  "apache-airflow==2.9.3",
  "apache-airflow-providers-cncf-kubernetes==8.3.4",
  "apache-airflow-providers-hashicorp==4.0.0",
  "psycopg2-binary==2.9.10",
]

# Единый dev-extra: union всех сервисных extras + тесты + линтеры +
# инструменты экспорта модели. `uv sync --extra dev` ставит всё, что
# нужно для разработки, lint, mypy и тестов одной командой.
#
# Onnx-инструменты тянутся только в dev, потому что они нужны для
# конвертации модели (PT → ONNX → NCNN), которая делается оператором
# один раз и не нужна в прод-runtime'е сервисов.
dev = [
  "rescue-ai[api,detection,nav-engine,sync-worker,batch-worker,batch-exporter,airflow]",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "matplotlib>=3.8,<4",
  "black==24.10.0",
  "flake8==7.1.1",
  "isort==5.13.2",
  "mypy==1.11.2",
  "types-PyYAML==6.0.12.20250915",
  "pylint==3.3.1",
  "onnx>=1.16,<2",
  "onnxslim>=0.1.60,<0.2",
  "onnxruntime>=1.18,<2",
  "onnxscript>=0.1,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
files = ["rescue_ai", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a running Postgres database",
]

[tool.coverage.run]
omit = [
  "rescue_ai/infrastructure/detectors/nanodet_core/*",
]

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["cv2"]
generated-members = ["cv2.*"]
ignore-paths = ["^rescue_ai/infrastructure/detectors/nanodet_core/.*$"]

[tool.pylint.format]
max-module-lines = 1600

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 32
max-returns = 8
max-statements = 70
max-branches = 15

[tool.pylint.basic]
good-names = [
    "i", "j", "k", "x", "y", "z", "n", "m", "h", "w", "c", "p", "t", "s", "f", "_",
    "H", "K", "A", "D", "L", "X", "Hf", "invH",
    "p0", "p1", "cs", "dt", "ef", "eb", "fb",
]
good-names-rgxs = "^[HK]_[a-zA-Z_0-9]+$"

[tool.pylint."messages_control"]
disable = [
    "C0116",  # missing-function-docstring (Protocol/CRUD methods)
    "R0801",  # duplicate-code
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access (needed in tests)
    "W0621",  # redefined-outer-name (pytest fixtures)
    "C0415",  # import-outside-toplevel (lazy imports)
]
