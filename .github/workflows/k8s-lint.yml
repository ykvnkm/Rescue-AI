name: k8s-lint

# Проверка Helm-чартов и values-профилей на синтаксис, рендеринг
# и характерные инварианты. Запускается в дополнение к ci.yml только
# на изменения в каталогах infra/k8s/** или в самом этом workflow.
#
# ADR-0008 §5.

on:
  push:
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-lint.yml"
  pull_request:
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-lint.yml"

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update umbrella dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
          helm repo add apache-airflow https://airflow.apache.org --force-update
          helm repo update
          helm dependency update infra/k8s/charts/rescue-ai
          helm dependency update infra/k8s/charts/rescue-batch

      - name: helm lint (rescue-ai-api)
        run: helm lint infra/k8s/charts/rescue-ai-api

      - name: helm lint (rescue-ai-detection)
        run: helm lint infra/k8s/charts/rescue-ai-detection

      - name: helm lint (rescue-ai-nav-engine)
        run: helm lint infra/k8s/charts/rescue-ai-nav-engine

      - name: helm lint (rescue-ai-sync-worker)
        run: helm lint infra/k8s/charts/rescue-ai-sync-worker

      - name: helm lint (rescue-ai-batch-exporter)
        run: helm lint infra/k8s/charts/rescue-ai-batch-exporter

      - name: helm lint (umbrella rescue-ai)
        run: helm lint infra/k8s/charts/rescue-ai

      - name: helm lint (umbrella rescue-batch)
        run: helm lint infra/k8s/charts/rescue-batch

      - name: helm lint (umbrella rescue-ai-observability)
        run: helm lint infra/k8s/charts/rescue-ai-observability

      - name: helm template — rescue-ai offline profile
        run: |
          helm template rescue-ai infra/k8s/charts/rescue-ai \
            -f infra/k8s/values/offline.yaml > /tmp/offline.yaml
          test -s /tmp/offline.yaml

      - name: helm template — rescue-ai cloud profile
        run: |
          helm template rescue-ai infra/k8s/charts/rescue-ai \
            -f infra/k8s/values/cloud.yaml > /tmp/cloud.yaml
          test -s /tmp/cloud.yaml

      - name: helm template — rescue-batch cloud profile
        run: |
          helm template rescue-batch infra/k8s/charts/rescue-batch \
            -f infra/k8s/values/rescue-batch-cloud.yaml > /tmp/rescue-batch.yaml
          test -s /tmp/rescue-batch.yaml

      - name: helm template — rescue-ai-observability offline profile
        run: |
          helm template rescue-ai-observability \
            infra/k8s/charts/rescue-ai-observability \
            -f infra/k8s/values/observability-offline.yaml \
            > /tmp/obs-offline.yaml
          test -s /tmp/obs-offline.yaml

      - name: helm template — rescue-ai-observability cloud profile
        run: |
          helm template rescue-ai-observability \
            infra/k8s/charts/rescue-ai-observability \
            -f infra/k8s/values/observability-cloud.yaml \
            > /tmp/obs-cloud.yaml
          test -s /tmp/obs-cloud.yaml

      - name: Profile invariants — sync-worker
        # sync-worker — это offline-only компонент (станция отправляет
        # данные в центр при наличии связи). В cloud-профиле принимающая
        # сторона, sync-worker отсутствует.
        run: |
          grep -q "rescue-ai-rescue-ai-sync-worker" /tmp/offline.yaml
          ! grep -q "rescue-ai-rescue-ai-sync-worker" /tmp/cloud.yaml

      - name: Profile invariants — detection and nav-engine
        # Оба сервиса обрабатывают живые миссии и присутствуют там, где
        # миссии реально идут — на станции и в центральном кластере
        # (центр тоже выполняет миссии: стенд / потоковые / демо).
        run: |
          grep -q "rescue-ai-rescue-ai-detection" /tmp/offline.yaml
          grep -q "rescue-ai-rescue-ai-detection" /tmp/cloud.yaml
          grep -q "rescue-ai-rescue-ai-nav-engine" /tmp/offline.yaml
          grep -q "rescue-ai-rescue-ai-nav-engine" /tmp/cloud.yaml

      - name: Profile invariants — batch контур ОТСУТСТВУЕТ в rescue-ai
        # После S5 Airflow и batch-exporter переехали в отдельный
        # umbrella rescue-batch (namespace rescue-batch). В шаблонах
        # online umbrella'а их объектов быть не должно.
        run: |
          ! grep -q "kind: Deployment" /tmp/cloud.yaml || \
              ! grep -q "rescue-ai-rescue-ai-batch-exporter" /tmp/cloud.yaml
          ! grep -q "rescue-ai-rescue-ai-batch-exporter" /tmp/offline.yaml

      - name: Profile invariants — batch контур ПРИСУТСТВУЕТ в rescue-batch
        # В rescue-batch namespace должны быть batch-exporter и Airflow
        # scheduler/webserver.
        run: |
          grep -q "rescue-batch-rescue-ai-batch-exporter" /tmp/rescue-batch.yaml
          grep -q "rescue-batch-airflow-scheduler" /tmp/rescue-batch.yaml

      - name: Profile invariants — namespace isolation в rescue-batch
        # NetworkPolicy default-deny + ResourceQuota обязаны быть
        # развёрнуты в batch namespace.
        run: |
          grep -q "kind: NetworkPolicy" /tmp/rescue-batch.yaml
          grep -q "rescue-batch-default-deny" /tmp/rescue-batch.yaml
          grep -q "kind: ResourceQuota" /tmp/rescue-batch.yaml

      - name: Profile invariants — Vault Agent Injector annotations
        # Vault-аннотация присутствует в обоих прод-профилях
        # (secrets.source=vault). Локальная разработка идёт через
        # docker-compose с обычными env-переменными, k8s-профиля для
        # dev не существует.
        run: |
          grep -q "vault.hashicorp.com/agent-inject" /tmp/offline.yaml
          grep -q "vault.hashicorp.com/agent-inject" /tmp/cloud.yaml
