name: k8s-lint

# Проверка Helm-чартов и values-профилей на синтаксис, рендеринг
# и характерные инварианты. Запускается в дополнение к ci.yml только
# на изменения в каталогах infra/k8s/** или в самом этом workflow.
#
# ADR-0008 §5.

on:
  push:
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-lint.yml"
  pull_request:
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-lint.yml"

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update umbrella dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
          helm repo add apache-airflow https://airflow.apache.org --force-update
          helm repo update
          helm dependency update infra/k8s/charts/rescue-ai

      - name: helm lint (rescue-ai-api)
        run: helm lint infra/k8s/charts/rescue-ai-api

      - name: helm lint (rescue-ai-detection)
        run: helm lint infra/k8s/charts/rescue-ai-detection

      - name: helm lint (rescue-ai-nav-engine)
        run: helm lint infra/k8s/charts/rescue-ai-nav-engine

      - name: helm lint (rescue-ai-sync-worker)
        run: helm lint infra/k8s/charts/rescue-ai-sync-worker

      - name: helm lint (rescue-ai-batch-exporter)
        run: helm lint infra/k8s/charts/rescue-ai-batch-exporter

      - name: helm lint (umbrella)
        run: helm lint infra/k8s/charts/rescue-ai

      - name: helm template — dev profile
        run: |
          helm template rescue-ai infra/k8s/charts/rescue-ai \
            -f infra/k8s/values/dev.yaml > /tmp/dev.yaml
          test -s /tmp/dev.yaml

      - name: helm template — offline profile
        run: |
          helm template rescue-ai infra/k8s/charts/rescue-ai \
            -f infra/k8s/values/offline.yaml > /tmp/offline.yaml
          test -s /tmp/offline.yaml

      - name: helm template — cloud profile
        run: |
          helm template rescue-ai infra/k8s/charts/rescue-ai \
            -f infra/k8s/values/cloud.yaml > /tmp/cloud.yaml
          test -s /tmp/cloud.yaml

      - name: Profile invariants — sync-worker
        # sync-worker — это offline-only компонент (станция отправляет
        # данные в центр при наличии связи). В cloud-профиле принимающая
        # сторона, sync-worker отсутствует. В dev — smoke без репликации.
        run: |
          grep -q "rescue-ai-rescue-ai-sync-worker" /tmp/offline.yaml
          ! grep -q "rescue-ai-rescue-ai-sync-worker" /tmp/cloud.yaml
          ! grep -q "rescue-ai-rescue-ai-sync-worker" /tmp/dev.yaml

      - name: Profile invariants — detection and nav-engine
        # Оба сервиса обрабатывают живые миссии и присутствуют там, где
        # миссии реально идут — на станции и в центральном кластере
        # (центр тоже выполняет миссии: стенд / потоковые / демо).
        run: |
          grep -q "rescue-ai-rescue-ai-detection" /tmp/offline.yaml
          grep -q "rescue-ai-rescue-ai-detection" /tmp/cloud.yaml
          grep -q "rescue-ai-rescue-ai-nav-engine" /tmp/offline.yaml
          grep -q "rescue-ai-rescue-ai-nav-engine" /tmp/cloud.yaml

      - name: Profile invariants — batch-exporter and Airflow only in cloud
        # batch-exporter и Apache Airflow живут только в центральном
        # кластере. Локальная станция не выполняет ежедневный
        # batch-пересчёт качества модели — он осмыслен только над
        # аккумулированным набором миссий со всех станций.
        run: |
          grep -q "rescue-ai-rescue-ai-batch-exporter" /tmp/cloud.yaml
          ! grep -q "rescue-ai-rescue-ai-batch-exporter" /tmp/offline.yaml
          ! grep -q "rescue-ai-rescue-ai-batch-exporter" /tmp/dev.yaml

      - name: Profile invariants — Vault Agent Injector annotations
        # Vault-аннотация присутствует во всех production-like профилях,
        # где secrets.source=vault. dev — единственный профиль с
        # обычными kube Secret'ами.
        run: |
          grep -q "vault.hashicorp.com/agent-inject" /tmp/offline.yaml
          grep -q "vault.hashicorp.com/agent-inject" /tmp/cloud.yaml
          ! grep -q "vault.hashicorp.com/agent-inject" /tmp/dev.yaml

  kind-smoke:
    # Лёгкий smoke: поднимаем kind, ставим чарт в dev-режиме,
    # ждём readiness API. Без интернета внешним секретам неоткуда
    # взяться, поэтому на CI используем dev (inline kube secrets).
    needs: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: helm/kind-action@v1
        with:
          version: v0.23.0
          cluster_name: rescue-ai

      - name: Build online image
        run: docker build --target app -t rescue-ai-online:local -f Dockerfile .

      - name: Load image into kind
        run: kind load docker-image rescue-ai-online:local --name rescue-ai

      - name: Helm install (dev profile)
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
          helm repo add apache-airflow https://airflow.apache.org --force-update
          helm repo update
          helm dependency update infra/k8s/charts/rescue-ai
          kubectl create namespace rescue-ai
          kubectl -n rescue-ai create configmap pg-init --from-file=infra/postgres/init/
          helm install rescue-ai infra/k8s/charts/rescue-ai \
            -n rescue-ai \
            -f infra/k8s/values/dev.yaml

      - name: Wait for dev workload
        run: |
          kubectl -n rescue-ai rollout status statefulset/rescue-ai-postgresql --timeout=10m
          kubectl -n rescue-ai rollout status deployment/rescue-ai-minio --timeout=10m
          kubectl -n rescue-ai rollout status deployment/rescue-ai-rescue-ai-api --timeout=10m

      - name: Dump Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n rescue-ai get all || true
          kubectl -n rescue-ai describe pods || true
          kubectl -n rescue-ai get events --sort-by=.lastTimestamp || true
          kubectl -n rescue-ai logs -l app.kubernetes.io/name=rescue-ai-api --tail=200 || true
          kubectl -n rescue-ai logs -l app.kubernetes.io/name=postgresql --tail=200 || true

      - name: API health check
        run: |
          kubectl -n rescue-ai port-forward svc/rescue-ai-rescue-ai-api 8000:8000 &
          sleep 5
          curl -fsS http://localhost:8000/health
