name: deploy

# Прод-деплой через Helm в k3s-кластер на VPS.
#
# Триггерится автоматически после успешного `ci.yml` на ветке main,
# либо вручную через workflow_dispatch.
#
# Что делает:
#   1. build-online    — собирает образ rescue-ai-online и пушит в GHCR
#                        с тегами latest и ${GIT_SHA}.
#   2. build-batch     — то же для образа batch (контейнеры Airflow-стадий).
#   3. deploy          — подключается к VPS по SSH, обновляет репо,
#                        делает `helm upgrade --install rescue-ai`
#                        с подменой image.tag на свежий ${GIT_SHA}.

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-online:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-online:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-online:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/rescue-ai-online:latest
            ghcr.io/${{ github.repository_owner }}/rescue-ai-online:${{ env.DEPLOY_SHA }}

  build-batch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: batch
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-batch:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-batch:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/rescue-ai-batch:latest
            ghcr.io/${{ github.repository_owner }}/rescue-ai-batch:${{ env.DEPLOY_SHA }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-online, build-batch]
    permissions: { contents: read, packages: read }
    steps:
      - name: Helm upgrade via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_SHA: ${{ env.DEPLOY_SHA }}
          OWNER: ${{ github.repository_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GIT_SHA,OWNER,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 30m
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/rescue-ai"
            NAMESPACE="rescue-ai"
            export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"

            echo "==> Update repository to commit ${GIT_SHA}"
            cd "${REPO_DIR}"
            git fetch --depth=1 origin "${GIT_SHA}"
            git checkout --detach "${GIT_SHA}"

            echo "==> Ensure namespace"
            kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Refresh pg-init ConfigMap"
            kubectl -n "${NAMESPACE}" delete configmap pg-init --ignore-not-found
            kubectl -n "${NAMESPACE}" create configmap pg-init \
                --from-file=infra/postgres/init/

            echo "==> Ensure GHCR pull secret"
            kubectl -n "${NAMESPACE}" create secret docker-registry ghcr-pull \
                --docker-server=ghcr.io \
                --docker-username="${GHCR_USERNAME}" \
                --docker-password="${GHCR_TOKEN}" \
                --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Ensure rpi-mtls secret (server-side files in ~/secrets/)"
            kubectl -n "${NAMESPACE}" create secret generic rpi-mtls \
                --from-file=ca.crt="$HOME/secrets/station-root-ca.crt" \
                --from-file=client.crt="$HOME/secrets/gcs-client.crt" \
                --from-file=client.key="$HOME/secrets/gcs-client.key" \
                --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Resolve umbrella chart dependencies"
            helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
            helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
            helm repo add apache-airflow https://airflow.apache.org --force-update
            helm repo update
            helm dependency update infra/k8s/charts/rescue-ai

            echo "==> Deploy rescue-ai (Helm upgrade --install)"
            # Используется профиль offline (полная self-contained
            # одноузловая инсталляция); источник образа переопределяется
            # на GHCR с тегом текущего коммита.
            IMAGE_REPO="ghcr.io/${OWNER}/rescue-ai-online"
            helm upgrade --install rescue-ai infra/k8s/charts/rescue-ai \
                --namespace "${NAMESPACE}" \
                -f infra/k8s/values/offline.yaml \
                --set rescue-ai-api.image.repository="${IMAGE_REPO}" \
                --set rescue-ai-api.image.tag="${GIT_SHA}" \
                --set rescue-ai-api.image.pullPolicy="Always" \
                --set-json "rescue-ai-api.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set rescue-ai-detection.image.repository="${IMAGE_REPO}" \
                --set rescue-ai-detection.image.tag="${GIT_SHA}" \
                --set rescue-ai-detection.image.pullPolicy="Always" \
                --set-json "rescue-ai-detection.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set rescue-ai-nav-engine.image.repository="${IMAGE_REPO}" \
                --set rescue-ai-nav-engine.image.tag="${GIT_SHA}" \
                --set rescue-ai-nav-engine.image.pullPolicy="Always" \
                --set-json "rescue-ai-nav-engine.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set rescue-ai-batch-exporter.image.repository="${IMAGE_REPO}" \
                --set rescue-ai-batch-exporter.image.tag="${GIT_SHA}" \
                --set rescue-ai-batch-exporter.image.pullPolicy="Always" \
                --set-json "rescue-ai-batch-exporter.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set "airflow.env[0].value=${IMAGE_REPO}:${GIT_SHA}" \
                --wait --timeout 15m

            echo "==> Check Vault Agent rendered application secrets"
            # Real secrets are provisioned outside CI/CD. The deploy job only
            # verifies that Vault Agent Injector rendered the expected env file.
            kubectl -n "${NAMESPACE}" exec -i deploy/rescue-ai-rescue-ai-api -- \
                bash -lc "test -f /vault/secrets/app.env" \
                || echo "WARNING: vault-agent did not produce /vault/secrets/app.env; check Vault role binding"

            echo "==> Wait for rollout"
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-api --timeout=5m
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-detection --timeout=5m
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-nav-engine --timeout=5m
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-batch-exporter --timeout=5m

            echo "==> Health check"
            kubectl -n "${NAMESPACE}" port-forward svc/rescue-ai-rescue-ai-api 8000:8000 &
            PF_PID=$!
            sleep 5
            curl -fsS http://127.0.0.1:8000/health || (kill $PF_PID; exit 1)
            kill $PF_PID || true

            echo "==> Deploy complete: rescue-ai @ ${GIT_SHA}"
