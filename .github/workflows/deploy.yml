name: deploy

# Прод-деплой через Helm в k3s-кластер на VPS.
#
# Триггерится автоматически после успешного `ci.yml` на ветке main,
# либо вручную через workflow_dispatch.
#
# Что делает:
#   1. build (matrix) — собирает шесть независимых образов
#      (api / detection / nav-engine / sync-worker / batch-worker /
#      batch-exporter) и пушит каждый в свой GHCR-репозиторий с
#      тегами latest и ${GIT_SHA}.
#   2. deploy         — подключается к VPS по SSH, обновляет репо,
#                       делает `helm upgrade --install rescue-ai`
#                       с подменой image.repository / image.tag для
#                       каждого сервиса на свежий образ.

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - detection
          - nav-engine
          # sync-worker не нужен в cloud-профиле (облако ПРИНИМАЕТ данные от
          # станций, само ничего не синкает) — не собираем. batch-worker и
          # batch-exporter нужны для batch-контура (Airflow) — оставляем.
          - batch-worker
          - batch-exporter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-${{ matrix.service }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rescue-ai-${{ matrix.service }}:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/rescue-ai-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/rescue-ai-${{ matrix.service }}:${{ env.DEPLOY_SHA }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions: { contents: read, packages: read }
    steps:
      - name: Helm upgrade via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_SHA: ${{ env.DEPLOY_SHA }}
          OWNER: ${{ github.repository_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Bootstrap-секрет уровня инфраструктуры: connection URI
          # к Airflow metadata DB (см. cloud.yaml → data.metadataSecretName).
          AIRFLOW_DB_URI: ${{ secrets.AIRFLOW_DB_URI }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GIT_SHA,OWNER,GHCR_USERNAME,GHCR_TOKEN,AIRFLOW_DB_URI
          command_timeout: 30m
          script: |
            set -euo pipefail

            if [ "$(id -u)" -eq 0 ] || [ "${USER:-}" = "root" ]; then
              echo "ERROR: Refusing to deploy as root. Use a dedicated non-root deploy user."
              exit 1
            fi

            REPO_DIR="$HOME/rescue-ai"
            NAMESPACE="rescue-ai"
            export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"

            echo "==> Update repository to commit ${GIT_SHA}"
            cd "${REPO_DIR}"
            git fetch --depth=1 origin "${GIT_SHA}"
            git checkout --detach "${GIT_SHA}"

            echo "==> Ensure namespace"
            kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Refresh pg-init ConfigMap"
            kubectl -n "${NAMESPACE}" delete configmap pg-init --ignore-not-found
            kubectl -n "${NAMESPACE}" create configmap pg-init \
                --from-file=infra/postgres/init/

            echo "==> Ensure GHCR pull secret"
            kubectl -n "${NAMESPACE}" create secret docker-registry ghcr-pull \
                --docker-server=ghcr.io \
                --docker-username="${GHCR_USERNAME}" \
                --docker-password="${GHCR_TOKEN}" \
                --dry-run=client -o yaml | kubectl apply -f -

            # rpi-mtls secret is offline/station-only (the cloud contour never
            # talks to a drone; cloud.yaml runs tlsMode=off). Skipped here.

            echo "==> Ensure airflow meta-db secret (chicken-and-egg, see vault_setup.md)"
            # Airflow ещё не запущен — он не может сам прочитать
            # connection-URI своей metadata DB из Vault. Этот секрет
            # bootstrap-уровня, как и rpi-mtls и ghcr-pull. URI
            # формата postgresql://user:pass@host:port/db приходит
            # из GitHub Secret AIRFLOW_DB_URI.
            kubectl -n "${NAMESPACE}" create secret generic rescue-airflow-meta-db \
                --from-literal=connection="${AIRFLOW_DB_URI}" \
                --dry-run=client -o yaml | kubectl apply -f -

            echo "==> Resolve umbrella chart dependencies (local file:// subcharts only)"
            # The umbrella depends ONLY on the four local file:// service charts
            # (api/detection/nav-engine/sync-worker) — no bitnami/hashicorp/airflow
            # repos are required. We must NOT `helm repo add hashicorp` here: that
            # CDN geo-blocks the server's IP (HTTP 403) and would abort the deploy.
            # dependency update re-packages the local subcharts with no network.
            helm dependency update infra/k8s/charts/rescue-ai

            echo "==> Deploy rescue-ai (Helm upgrade --install)"
            # Каждый сервис ссылается на собственный GHCR-репозиторий.
            # Airflow тянет stock-образ apache/airflow:2.9.3 и запускает
            # batch-worker через KubernetesPodOperator из отдельного образа.
            REGISTRY="ghcr.io/${OWNER}"
            helm upgrade --install rescue-ai infra/k8s/charts/rescue-ai \
                --namespace "${NAMESPACE}" \
                -f infra/k8s/values/cloud.yaml \
                --set rescue-ai-api.image.repository="${REGISTRY}/rescue-ai-api" \
                --set rescue-ai-api.image.tag="${GIT_SHA}" \
                --set rescue-ai-api.image.pullPolicy="Always" \
                --set-json "rescue-ai-api.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set rescue-ai-detection.image.repository="${REGISTRY}/rescue-ai-detection" \
                --set rescue-ai-detection.image.tag="${GIT_SHA}" \
                --set rescue-ai-detection.image.pullPolicy="Always" \
                --set-json "rescue-ai-detection.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --set rescue-ai-nav-engine.image.repository="${REGISTRY}/rescue-ai-nav-engine" \
                --set rescue-ai-nav-engine.image.tag="${GIT_SHA}" \
                --set rescue-ai-nav-engine.image.pullPolicy="Always" \
                --set-json "rescue-ai-nav-engine.imagePullSecrets=[{\"name\":\"ghcr-pull\"}]" \
                --wait --timeout 15m

            # ── Batch-контур (rescue-batch namespace) ─────────────────
            # Online (offline.yaml) batch не разворачивает; Airflow и
            # batch-exporter живут только в cloud через отдельный helm
            # release umbrella'а rescue-batch (см. ADR-0008 §4 и
            # infra/k8s/values/rescue-batch-cloud.yaml).
            #
            # Если этот workflow когда-нибудь будет деплоить и в cloud,
            # добавь параллельный шаг:
            #
            #   kubectl create namespace rescue-batch --dry-run=client -o yaml \
            #       | kubectl apply -f -
            #   helm upgrade --install rescue-batch \
            #       infra/k8s/charts/rescue-batch \
            #       -n rescue-batch \
            #       -f infra/k8s/values/rescue-batch-cloud.yaml \
            #       --set rescue-ai-batch-exporter.image.repository="${REGISTRY}/rescue-ai-batch-exporter" \
            #       --set rescue-ai-batch-exporter.image.tag="${GIT_SHA}" \
            #       --set "airflow.env[0].value=${REGISTRY}/rescue-ai-batch-worker:${GIT_SHA}"

            # ── Контур наблюдаемости (namespace monitoring) ───────────
            # Prometheus + Alertmanager + Grafana. Отдельный helm release
            # (свой namespace, свой lifecycle — НЕ subchart rescue-ai), но
            # ставится тем же пайплайном, чтобы развёртывание было полным и
            # воспроизводимым, а не «доустанавливалось руками».
            #
            # Чарт самодостаточный (голые Deployment'ы, без community-
            # subchart'ов) — geo-block hashicorp/prometheus CDN не мешает.
            # admin-пароль Grafana и SMTP Alertmanager приходят из Vault
            # (Agent Injection), поэтому секретов в namespace monitoring нет.
            echo "==> Ensure monitoring namespace"
            kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
            echo "==> Deploy observability (Prometheus / Alertmanager / Grafana)"
            # --wait: ждём готовности мониторинга и ВАЛИМ деплой, если он не
            # поднялся — CI обязан реально проверять, что мониторинг работает.
            #
            # Раньше тут случался OOM: Prometheus с лимитом 4Gi без привязки к
            # нодам садился на 2-ядерный control-plane и убивал ноду целиком.
            # Это устранено в observability-cloud.yaml: лимиты ужаты (1Gi) и
            # nodeAffinity уводит мониторинг на воркеры, прочь от control-plane.
            # Поэтому --wait теперь безопасен и оставлен как полноценная проверка.
            helm upgrade --install rescue-ai-observability \
                infra/k8s/charts/rescue-ai-observability \
                --namespace monitoring \
                -f infra/k8s/values/observability-cloud.yaml \
                --wait --timeout 10m

            echo "==> Check Vault Agent rendered application secrets"
            # Real secrets are provisioned outside CI/CD. The deploy job only
            # verifies that Vault Agent Injector rendered the expected env file.
            kubectl -n "${NAMESPACE}" exec -i deploy/rescue-ai-rescue-ai-api -- \
                bash -lc "test -f /vault/secrets/app.env" \
                || echo "WARNING: vault-agent did not produce /vault/secrets/app.env; check Vault role binding"

            echo "==> Wait for rollout"
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-api --timeout=5m
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-detection --timeout=5m
            kubectl -n "${NAMESPACE}" rollout status deploy/rescue-ai-rescue-ai-nav-engine --timeout=5m

            echo "==> Health check"
            kubectl -n "${NAMESPACE}" port-forward svc/rescue-ai-rescue-ai-api 8000:8000 &
            PF_PID=$!
            sleep 5
            curl -fsS http://127.0.0.1:8000/health || (kill $PF_PID; exit 1)
            kill $PF_PID || true

            echo "==> Deploy complete: rescue-ai @ ${GIT_SHA}"
