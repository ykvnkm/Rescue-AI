# Конфигурация Prometheus для контура наблюдаемости Rescue-AI.
#
# Соответствует разделу 3.5 «Развёртывание, сопровождение и эксплуатация
# сервиса» и реализует требования к мониторингу, описанные в разделе 2.7.
#
# Scrape-цели:
#   * rescue-ai-api          — основной сервис управления миссией
#                              (метрики на /metrics, HTTP-метрики +
#                              доменные счётчики/гистограммы);
#   * rescue-ai-detection    — сервис обнаружения людей;
#   * rescue-ai-nav-engine   — сервис восстановления траектории;
#   * rescue-ai-batch-exporter — мост между таблицей
#                                batch_pipeline_metrics и Prometheus.
#
# Правила алертинга разделены на два файла соответственно двум
# контурам наблюдаемости:
#   * rules-station.yml — операционные правила наземной станции;
#   * rules-central.yml — операционные + ML + drift правила
#                         центрального кластера.
# В реальном развёртывании каждый Prometheus загружает только свой
# файл. В docker-compose ниже подключаются оба, чтобы дипломный
# стенд позволял снимать скриншоты обоих контуров на одной машине.
# Alertmanager объявлен здесь как получатель срабатываний.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: rescue-ai
    environment: ${PROMETHEUS_ENV:-dev}

rule_files:
  - /etc/prometheus/rules-station.yml
  - /etc/prometheus/rules-central.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: rescue-ai-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - rescue-ai-api:8000

  - job_name: rescue-ai-detection
    metrics_path: /metrics
    static_configs:
      - targets:
          - rescue-ai-detection:8002

  - job_name: rescue-ai-nav-engine
    metrics_path: /metrics
    static_configs:
      - targets:
          - rescue-ai-nav-engine:8001

  - job_name: rescue-ai-batch-exporter
    metrics_path: /metrics
    # batch_pipeline_metrics обновляется ежедневным DAG; экспортер
    # обновляет gauge'и раз в 5 минут, поэтому редкий scrape
    # допустим, но мы оставляем 15s для единообразия.
    static_configs:
      - targets:
          - rescue-ai-batch-exporter:8003

  # Self-scrape, чтобы видеть состояние самого Prometheus
  # на дашборде сопровождения.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
