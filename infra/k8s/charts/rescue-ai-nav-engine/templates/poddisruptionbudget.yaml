{{- if and .Values.enabled .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rescue-ai-nav-engine.fullname" . }}
  labels:
    {{- include "rescue-ai-nav-engine.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "rescue-ai-nav-engine.selectorLabels" . | nindent 6 }}
{{- end }}
