{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# nav-engine — stateless: только принимает кадры по HTTP от api.
# Egress только DNS — никаких внешних соединений.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rescue-ai-nav-engine.fullname" . }}
  labels:
    {{- include "rescue-ai-nav-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rescue-ai-nav-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rescue-ai-api
      ports:
        - port: 8001
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8001
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
