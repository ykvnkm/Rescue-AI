enabled: false  # включается в profile values при разделении сервисов

replicaCount: 1

image:
  repository: rescue-ai-nav-engine
  pullPolicy: IfNotPresent
  tag: "local"

deployment:
  logLevel: INFO
  appEnv: dev

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # nav-engine стартует быстро (нет тяжёлых импортов модели);
  # короткий startupProbe — 30 секунд бюджета.
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 3
    failureThreshold: 10

terminationGracePeriodSeconds: 15
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 3"]

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# HPA для nav-engine обычно не нужен (нагрузка прибита к темпу
# кадров: 6 fps × N миссий). Оставлен для cloud-сценария с большим
# количеством одновременных миссий.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

networkPolicy:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
