{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# sync-worker: ingress закрыт полностью (нет HTTP), egress — к
# локальной Postgres, удалённой Postgres и удалённому S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rescue-ai-sync-worker.fullname" . }}
  labels:
    {{- include "rescue-ai-sync-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rescue-ai-sync-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Никаких входящих коннектов; weniger Lärm = меньше attack surface.
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Локальная Postgres — читаем outbox.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Vault (для Agent Injector).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    # Удалённый Postgres + удалённый S3 (Yandex Cloud).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - port: 5432             # remote Postgres
          protocol: TCP
        - port: 6432             # PgBouncer (Yandex Managed PG)
          protocol: TCP
        - port: 443              # remote S3 https
          protocol: TCP
{{- end }}
