{{- if and .Values.enabled .Values.podDisruptionBudget.enabled }}
# sync-worker singleton. PDB c maxUnavailable=0 запрещает k8s
# самовольно выгонять под при drain ноды — оператор должен явно
# завершить worker через `kubectl scale deploy/... --replicas=0`
# и убедиться, что outbox дренирован, прежде чем сливать ноду.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rescue-ai-sync-worker.fullname" . }}
  labels:
    {{- include "rescue-ai-sync-worker.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "rescue-ai-sync-worker.selectorLabels" . | nindent 6 }}
{{- end }}
