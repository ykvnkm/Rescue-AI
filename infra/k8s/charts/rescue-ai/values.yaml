# Дефолты umbrella-чарта (cloud-ориентированные). Конкретные профили
# лежат в infra/k8s/values/{cloud,offline}.yaml и подключаются при
# установке: `helm install rescue-ai . -f ../../values/<profile>.yaml`.
# Локальная разработка идёт через docker-compose из корня репо, а не
# через kind/minikube — k8s-профиля для dev не существует.

rescue-ai-api:
  enabled: true
  deployment:
    deploymentMode: cloud

# Прикладные микросервисы — выключены по умолчанию, чтобы у дефолтного
# `helm install` без -f не разворачивался лишнего. Профили включают
# нужные сервисы явно.
rescue-ai-detection:
  enabled: false

rescue-ai-nav-engine:
  enabled: false

rescue-ai-sync-worker:
  enabled: false   # только offline

# Инфра-зависимости — выключены по умолчанию (предполагается managed).
postgresql:
  enabled: false

minio:
  enabled: false

vault:
  enabled: false

# Offline-prod локальная инфраструктура без k8s Secret как source of truth.
# Включается только через infra/k8s/values/offline.yaml после отдельной
# установки и bootstrap Vault.
localPostgresql:
  enabled: false

localMinio:
  enabled: false

# Ежедневный backup локальной Postgres → MinIO.
# Включается вместе с localPostgresql в offline.yaml.
localPostgresqlBackup:
  enabled: false
  schedule: "0 2 * * *"            # каждый день в 02:00 UTC
  bucket: rescue-artifacts
  image:
    repository: postgres
    tag: "16-alpine"
  mcImage:
    repository: quay.io/minio/mc
    tag: "RELEASE.2024-07-22T20-02-49Z"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Airflow и batch-exporter переехали в umbrella rescue-batch
# (namespace rescue-batch). См. infra/k8s/charts/rescue-batch/.
