# Дефолты umbrella-чарта (cloud-ориентированные). Конкретные профили
# лежат в infra/k8s/values/{cloud,offline,dev}.yaml и подключаются
# при установке: `helm install rescue-ai . -f ../../values/<profile>.yaml`.

rescue-ai-api:
  enabled: true
  deployment:
    deploymentMode: cloud

# Прикладные микросервисы — выключены по умолчанию, чтобы у дефолтного
# `helm install` без -f не разворачивался лишнего. Профили включают
# нужные сервисы явно.
rescue-ai-detection:
  enabled: false

rescue-ai-nav-engine:
  enabled: false

rescue-ai-sync-worker:
  enabled: false   # только offline

rescue-ai-batch-exporter:
  enabled: false   # offline + cloud

# Инфра-зависимости — выключены по умолчанию (предполагается managed).
postgresql:
  enabled: false

minio:
  enabled: false

vault:
  enabled: false

airflow:
  enabled: false   # offline + cloud
