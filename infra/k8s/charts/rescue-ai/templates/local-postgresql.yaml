{{- if .Values.localPostgresql.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.localPostgresql.serviceAccountName | quote }}
  labels:
    {{- include "rescue-ai.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rescue-ai.localPostgresql.name" . }}
  labels:
    {{- include "rescue-ai.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rescue-ai.localPostgresql.name" . }}
  labels:
    {{- include "rescue-ai.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "rescue-ai.localPostgresql.name" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.localPostgresql.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-postgres-password: {{ printf "secret/data/%s" .Values.localPostgresql.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-postgres-password: |
          {{`{{- with secret "`}}{{ printf "secret/data/%s" .Values.localPostgresql.vault.secretPath }}{{`" -}}`}}
          {{`{{ .Data.data.POSTGRES_PASSWORD }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: {{ .Values.localPostgresql.serviceAccountName | quote }}
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.localPostgresql.image.repository }}:{{ .Values.localPostgresql.image.tag }}"
          imagePullPolicy: {{ .Values.localPostgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.localPostgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.localPostgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /vault/secrets/postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.localPostgresql.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ .Values.localPostgresql.initdb.scriptsConfigMap | quote }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.localPostgresql.persistence.storageClass }}
        storageClassName: {{ .Values.localPostgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.localPostgresql.persistence.size | quote }}
{{- end }}
