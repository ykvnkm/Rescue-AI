# ServiceAccount для ephemeral подов batch-стадий ML-пайплайна
# (создаются Airflow KubernetesPodOperator-ом на каждой таске).
#
# Намеренно отдельный SA от Airflow-овых scheduler/webserver/worker:
#   * batch-worker pod не должен наследовать прав Airflow на чтение
#     metadata-DB и Vault role rescue-ai-airflow;
#   * SA можно отдельно ограничить RBAC при необходимости.
#
# Секреты в batch-worker pod передаются env-переменными от Airflow
# (он сам забирает их из Vault Secrets Backend и пробрасывает через
# KubernetesPodOperator.env), поэтому Vault Agent-аннотаций тут нет.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rescue-batch-worker
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "rescue-batch.labels" . | nindent 4 }}
    app.kubernetes.io/name: batch-worker
    app.kubernetes.io/component: ephemeral-task-pod
