enabled: false  # включается в profile values при разделении сервисов

replicaCount: 1

image:
  repository: rescue-ai-detection
  pullPolicy: IfNotPresent
  tag: "local"

deployment:
  logLevel: INFO
  appEnv: dev

service:
  type: ClusterIP
  port: 8002

# Модели подгружаются с того же URL/cache, что и в монолитном API.
# В offline-сценарии runtime/models должен быть запечён в образ
# (см. infra/offline/README.md).
modelCache:
  # Если хочется отделить кеш — смонтировать persistent volume.
  enabled: false
  size: 5Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: http
    periodSeconds: 10
    failureThreshold: 3
  # Детекция стартует медленно: качает веса (PT или NCNN) из S3,
  # инициализирует ultralytics+ncnn-runtime. Бюджет: 120*5s=10 мин.
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 120

terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# HPA. Детекция — самый CPU-нагруженный сервис; включается в cloud.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
