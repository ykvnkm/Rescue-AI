{{- if .Values.grafana.enabled }}
# ServiceAccount, под которым Grafana проходит Vault k8s-auth.
# Без отдельного SA Vault role привязалась бы к default SA namespace-а
# monitoring, что нарушает принцип «1 SA = 1 role = 1 policy».
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "obs.grafana.name" . }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
---
{{- if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "obs.grafana.name" . }}-data
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | quote }}
  {{- if .Values.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.grafana.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obs.grafana.name" . }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "obs.labels" . | nindent 8 }}
        app.kubernetes.io/name: grafana
      annotations:
        # Перекатываем pod при смене ConfigMap-ов.
        checksum/config: {{ include (print $.Template.BasePath "/grafana-configmap.yaml") . | sha256sum }}
        # Vault Agent Injector рендерит admin-credentials в файл
        # /vault/secrets/grafana.env. Файл sourced startup-скриптом
        # (см. command ниже) → переменные GF_SECURITY_ADMIN_USER /
        # GF_SECURITY_ADMIN_PASSWORD доходят до grafana-server.
        # Никакого k8s Secret в namespace monitoring больше нет —
        # admin-учётка живёт только в Vault (ADR-0008 §3,
        # диплом §3.5.4).
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "rescue-ai-grafana"
        vault.hashicorp.com/agent-inject-secret-grafana.env: "secret/data/rescue-ai/grafana"
        vault.hashicorp.com/agent-inject-template-grafana.env: |
          {{`{{- with secret "secret/data/rescue-ai/grafana" -}}`}}
          GF_SECURITY_ADMIN_USER={{`{{ .Data.data.admin_user }}`}}
          GF_SECURITY_ADMIN_PASSWORD={{`{{ .Data.data.admin_password }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: {{ include "obs.grafana.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472          # grafana — стандартный uid в grafana/grafana
        fsGroup: 472
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          # Vault Agent поднимает sidecar и рендерит файл с admin
          # credentials. Перед exec'ом grafana-server source-им файл
          # — переменные окружения попадают в процесс.
          command:
            - /bin/sh
            - -c
            - |
              if [ -f /vault/secrets/grafana.env ]; then
                set -a; . /vault/secrets/grafana.env; set +a
              fi
              exec /run.sh
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "obs.grafana.name" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: datasources
          configMap:
            name: {{ include "obs.grafana.name" . }}-datasources
        - name: provisioning
          configMap:
            name: {{ include "obs.grafana.name" . }}-provisioning
        - name: dashboards
          configMap:
            name: {{ include "obs.grafana.name" . }}-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs.grafana.name" . }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.grafana.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "obs.grafana.name" . }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
  {{- with .Values.grafana.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.grafana.ingress.ingressClassName }}
  ingressClassName: {{ .Values.grafana.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.grafana.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "obs.grafana.name" . }}
                port:
                  name: http
  {{- with .Values.grafana.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
