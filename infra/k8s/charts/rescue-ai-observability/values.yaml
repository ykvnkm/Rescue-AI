# Дефолты chart-а rescue-ai-observability.
#
# Профили: infra/k8s/values/observability-offline.yaml |
#          infra/k8s/values/observability-cloud.yaml
#
# Установка:
#   helm install rescue-ai-observability infra/k8s/charts/rescue-ai-observability \
#     -n monitoring --create-namespace \
#     -f infra/k8s/values/observability-<profile>.yaml

createNamespace: false
namespace: monitoring

# Контур: `station` (k3s на станции) | `central` (managed K8s).
# От него зависит, какие prometheus rules и какие grafana dashboards
# деплоятся (станционные / центральные).
contour: station

# ── Prometheus ──────────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.55.1
  retentionTime: 15d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: null     # default StorageClass (local-path в k3s)
  service:
    type: ClusterIP
    port: 9090
  # Куда Prometheus стучится для скрейпа /metrics.
  # Имена сервисов из чартов rescue-ai / rescue-batch (umbrella name
  # `rescue-ai-rescue-ai-api` и т.д. — стандартный bitnami-pattern).
  scrape:
    appNamespace: rescue-ai
    batchNamespace: rescue-batch
    apiService: rescue-ai-rescue-ai-api
    detectionService: rescue-ai-rescue-ai-detection
    navEngineService: rescue-ai-rescue-ai-nav-engine
    batchExporterService: rescue-batch-rescue-ai-batch-exporter
  ingress:
    enabled: false        # cloud-only; см. values-cloud.yaml

# ── Alertmanager ────────────────────────────────────────────────
alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: null
  service:
    type: ClusterIP
    port: 9093
  # Vault Agent для рендеринга SMTP credentials. Включается в cloud
  # (где есть прод-получатели и нужен реальный SMTP); в offline
  # local-режим Alertmanager отдаёт алерты только в собственный UI,
  # SMTP не используется → Vault Agent не подключён.
  vaultAgent:
    enabled: false

# ── Grafana ─────────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.3.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi
    storageClass: null
  # admin-учётка Grafana хранится исключительно в Vault на пути
  # secret/data/rescue-ai/grafana с полями admin_user и admin_password.
  # Заводится скриптом scripts/security/vault_bootstrap.sh при
  # ENABLE_GRAFANA=true. Vault Agent Injector рендерит её в файл
  # /vault/secrets/grafana.env внутри пода (см. deployment template).
  # Никаких k8s Secret-ов или --set с паролем в helm-команде не нужно.
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false        # cloud-only; см. values-cloud.yaml

# ── NetworkPolicy ───────────────────────────────────────────────
# default-deny в namespace `monitoring` + явные allow:
#   * ingress в Grafana от Ingress-controller (если ingress.enabled)
#   * egress от Prometheus в rescue-ai / rescue-batch на порты /metrics
#   * egress от Alertmanager наружу для SMTP/Slack (cloud)
networkPolicy:
  enabled: false
