{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# batch-exporter: ingress только от Prometheus, egress только в Postgres
# и Vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rescue-ai-batch-exporter.fullname" . }}
  labels:
    {{- include "rescue-ai-batch-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rescue-ai-batch-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ .Values.exporter.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # В cloud — managed Postgres снаружи кластера; в offline batch-exporter
    # вообще не разворачивается, поэтому достаточно ipBlock egress.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - port: 5432
          protocol: TCP
        - port: 6432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
{{- end }}
