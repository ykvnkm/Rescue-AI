{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rescue-ai-batch-exporter.fullname" . }}-config
  labels:
    {{- include "rescue-ai-batch-exporter.labels" . | nindent 4 }}
data:
  # Никаких неchувствительных параметров, не относящихся к exporter'у,
  # здесь не задаём — все настройки экспортера приходят через env
  # в deployment.yaml. ConfigMap оставлен для совместимости с
  # envFrom и единого checksum/config паттерна.
  EXPORTER_KIND: "batch-metrics"
{{- end }}
