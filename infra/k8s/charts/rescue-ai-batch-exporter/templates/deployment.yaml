{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rescue-ai-batch-exporter.fullname" . }}
  labels:
    {{- include "rescue-ai-batch-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}   {{/* HPA для batch-exporter избыточен — это thin gauge-эмиттер */}}
  selector:
    matchLabels:
      {{- include "rescue-ai-batch-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rescue-ai-batch-exporter.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Эндпоинт /metrics опрашивается Prometheus напрямую — см. chart
        # rescue-ai-observability (templates/prometheus-configmap.yaml,
        # job_name=rescue-ai-batch-exporter).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.exporter.port | quote }}
        prometheus.io/path: "/metrics"
        {{- if eq .Values.secrets.source "vault" }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.secrets.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-app.env: {{ printf "secret/data/%s" .Values.secrets.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{`{{- with secret "`}}{{ printf "secret/data/%s" .Values.secrets.vault.secretPath }}{{`" -}}`}}
          {{`{{- range $k, $v := .Data.data }}`}}
          {{`{{ $k }}={{ $v }}`}}
          {{`{{- end }}`}}
          {{`{{- end }}`}}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rescue-ai-batch-exporter.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.waitForPostgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.initContainers.waitForPostgres.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ include "rescue-ai-batch-exporter.fullname" . }}-config
            {{- if eq .Values.secrets.source "kube" }}
            - secretRef:
                name: {{ include "rescue-ai-batch-exporter.kubeSecretName" . }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /vault/secrets/app.env ]; then
                set -a; . /vault/secrets/app.env; set +a
              fi
              deadline=$(( $(date +%s) + {{ .Values.initContainers.waitForPostgres.timeoutSec }} ))
              until pg_isready -d "$DB_DSN" -q; do
                if [ $(date +%s) -gt $deadline ]; then
                  echo "wait-for-postgres: timeout"; exit 1
                fi
                sleep 2
              done
      {{- end }}
      containers:
        - name: batch-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq .Values.secrets.source "vault" }}
          command:
            - /bin/sh
            - -c
            - |
              if [ -f /vault/secrets/app.env ]; then
                set -a
                . /vault/secrets/app.env
                set +a
              fi
              exec python -m rescue_ai.interfaces.batch_exporter.run_service
          {{- else }}
          command: ["python", "-m", "rescue_ai.interfaces.batch_exporter.run_service"]
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rescue-ai-batch-exporter.fullname" . }}-config
            {{- if eq .Values.secrets.source "kube" }}
            - secretRef:
                name: {{ include "rescue-ai-batch-exporter.kubeSecretName" . }}
            {{- end }}
          env:
            - name: APP_ENV
              value: {{ .Values.deployment.appEnv | quote }}
            - name: APP_LOG_LEVEL
              value: {{ .Values.deployment.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.deployment.serviceVersion | quote }}
            - name: BATCH_EXPORTER_HOST
              value: "0.0.0.0"
            - name: BATCH_EXPORTER_PORT
              value: {{ .Values.exporter.port | quote }}
            - name: BATCH_EXPORTER_SCRAPE_INTERVAL_SEC
              value: {{ .Values.exporter.scrapeIntervalSec | quote }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rescue-ai-batch-exporter.fullname" . }}
  labels:
    {{- include "rescue-ai-batch-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "rescue-ai-batch-exporter.selectorLabels" . | nindent 4 }}
{{- end }}
