# Профиль `dev` — kind / minikube на ноуте разработчика.
# Самодостаточный smoke: API + локальные Postgres/MinIO subcharts,
# простые kube Secret'ы, без Vault/TLS/Ingress.

rescue-ai-api:
  enabled: true
  image:
    repository: rescue-ai-online
    tag: "local"
    pullPolicy: IfNotPresent
  deployment:
    deploymentMode: offline
    appEnv: dev
    logLevel: DEBUG
  config:
    storage:
      s3Endpoint: "http://rescue-ai-minio.rescue-ai.svc.cluster.local:9000"
      s3Bucket: rescue-artifacts
  security:
    tlsMode: "off"
  secrets:
    source: kube
    kube:
      existingSecret: rescue-ai-dev-api-secret
      inline: {}
  ingress:
    enabled: false

rescue-ai-sync-worker:
  enabled: false

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  auth:
    username: rescue
    database: rescue_ai
    existingSecret: rescue-ai-dev-postgresql-auth
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
  primary:
    initdb:
      scriptsConfigMap: pg-init
minio:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
  auth:
    existingSecret: rescue-ai-dev-minio-auth
    rootUserSecretKey: root-user
    rootPasswordSecretKey: root-password
  defaultBuckets: "rescue-artifacts"
vault:
  enabled: false
