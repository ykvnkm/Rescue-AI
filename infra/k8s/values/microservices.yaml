# ── АРХИВНЫЙ ФАЙЛ ─────────────────────────────────────────────────
#
# Профиль `microservices` использовался ранее как демонстрация
# «монолит vs split на отдельные сервисы». После того как
# микросервисное разделение стало дефолтом в обоих рабочих профилях
# (`offline`, `cloud`), отдельный profile-файл потерял смысл.
# Используйте:
#   - offline.yaml для наземной станции (полевой или VPS с k3s),
#   - cloud.yaml для managed-кластера.
#
# Файл оставлен для совместимости с историческими ссылками в
# документации и runbook-ах. Минимальная конфигурация ниже сохраняет
# валидность YAML, но самостоятельной нагрузки не несёт.

rescue-ai-api:
  enabled: true
  image:
    repository: rescue-ai-online
    tag: "local"
    pullPolicy: IfNotPresent
  deployment:
    deploymentMode: offline
    appEnv: dev
  security:
    tlsMode: "off"
  secrets:
    source: kube
    kube:
      existingSecret: rescue-ai-microservices-api-secret
      inline: {}

rescue-ai-detection:
  enabled: true
  image:
    repository: rescue-ai-online
    tag: "local"

rescue-ai-nav-engine:
  enabled: true
  image:
    repository: rescue-ai-online
    tag: "local"

rescue-ai-sync-worker:
  enabled: false

rescue-ai-batch-exporter:
  enabled: false

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  auth:
    username: rescue
    database: rescue_ai
    existingSecret: rescue-ai-microservices-postgresql-auth
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password

minio:
  enabled: false
vault:
  enabled: false
airflow:
  enabled: false
