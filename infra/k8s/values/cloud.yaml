# Профиль `cloud` — online контур приложения в managed Kubernetes
# (ADR-0007 §5, ADR-0008 §1, §4).
#
# Включённые сервисы:
#   * rescue-ai-api                   — управление миссией
#   * rescue-ai-detection             — обнаружение людей
#   * rescue-ai-nav-engine            — восстановление траектории
#
# Выключенные / внешние:
#   * rescue-ai-sync-worker           — не нужен в cloud (cloud получает данные)
#   * rescue-ai-batch-exporter        — переехал в отдельный umbrella
#                                       `rescue-batch` (см.
#                                       infra/k8s/values/rescue-batch-cloud.yaml)
#   * airflow                         — там же, в namespace rescue-batch
#   * postgresql                      — Yandex Managed PostgreSQL
#   * minio                           — Yandex Object Storage
#   * vault                           — развёрнут отдельным релизом (cluster-wide)
#
# Batch-контур ставится ОТДЕЛЬНЫМ helm release в namespace
# `rescue-batch`, не как subchart этого umbrella. Это даёт ресурсную
# изоляцию (ResourceQuota), сетевую изоляцию (NetworkPolicy) и
# независимый lifecycle Airflow от online-API.

rescue-ai-api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/ykvnkm/rescue-ai-api
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  deployment:
    deploymentMode: cloud
    appEnv: prod
    logLevel: INFO
    serviceVersion: ${IMAGE_TAG}
  # Прод-уровень K8s-резилентности (ADR-0008 §4).
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
    # Managed Postgres живёт ВНЕ кластера на нестандартном порту 18749 —
    # открываем api egress на него (k8s NetworkPolicy не умеет FQDN, поэтому
    # порт к 0.0.0.0/0, как 443 для S3). Без этого api не достучится до БД.
    extraEgressPorts:
      - 18749
  # Реплики api не должны жить на одной ноде — иначе один node-drain
  # положит весь сервис; кроме того, размазываемся по zone-меткам, если
  # managed K8s даёт их.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rescue-ai-api
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: rescue-ai-api
  config:
    api:
      # Public cloud demo is open (no bearer token) → cap requests/min/IP.
      # Must comfortably exceed the operator UI's own polling (~2-3 req/sec =
      # ~180/min) so legitimate use is never throttled; this still caps gross
      # abuse (per-IP). For controlled access add API_AUTH_TOKEN to Vault.
      rateLimitPerMin: 600
    storage:
      s3Endpoint: "https://storage.yandexcloud.net"
      s3Region: ru-central1
      s3Bucket: rescue-ai-artifacts
      s3Prefix: missions
    rpi:
      baseUrl: ""
      missionsDir: ""
    services:
      detectorUrl: "http://rescue-ai-rescue-ai-detection.rescue-ai.svc.cluster.local:8002"
      navEngineUrl: "http://rescue-ai-rescue-ai-nav-engine.rescue-ai.svc.cluster.local:8001"
  security:
    # До борта в cloud-режиме идёт cloudflared-туннель; mTLS
    # активируется снаружи. См. ADR-0007 §5.
    tlsMode: "off"
  secrets:
    source: vault
    vault:
      role: rescue-ai-api
      secretPath: rescue-ai/api
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Загрузка миссий (видео/ZIP кадров) идёт телом POST /auto-sessions/start.
      # Дефолт ingress-nginx — 1 МБ: без этого ingress рвёт большие аплоады
      # (браузер видит "TypeError: Load failed"). Поднимаем лимит до 1 ГБ.
      # Буферизацию тела НЕ отключаем: с request-buffering=off nginx стримит
      # тело в бэкенд в реальном времени, и обрыв аплоада валит form() в
      # ClientDisconnect. С буферизацией (дефолт) nginx сначала принимает файл
      # целиком, потом отдаёт бэкенду — надёжно для больших загрузок.
      nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
      # Sticky-сессии: auto-session хранит состояние в памяти КОНКРЕТНОГО пода.
      # При 2 репликах старт сессии (POST) и WS-стрим могут уйти на разные поды
      # → второй про сессию не знает → WS закрывается до accept → 403 → стрим не
      # подключается. Cookie-affinity закрепляет браузер за одним подом (старт+WS
      # на один под). Сохраняет 2 реплики/FT, чинит стрим.
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/affinity-mode: "persistent"
      nginx.ingress.kubernetes.io/session-cookie-name: "rescue-ai-route"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
      nginx.ingress.kubernetes.io/session-cookie-path: "/"
    hosts:
      - host: api.rescue-ai.ru
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: rescue-ai-tls
        hosts:
          - api.rescue-ai.ru
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

rescue-ai-detection:
  enabled: true
  image:
    repository: ghcr.io/ykvnkm/rescue-ai-detection
    tag: latest
  imagePullSecrets:
    - name: ghcr-pull
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
  # YOLO/NCNN-инференс — CPU-bound. Одиночная live-сессия обслуживается одним
  # detection-подом, поэтому потолок CPU пода = потолок FPS этой сессии. На
  # 8-ядерном воркере даём поду до 4 ядер; HPA добавляет реплики (targetCPU 70%).
  # На 2-ядерных нодах это и было причиной дикой задержки.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 3Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: rescue-ai-detection
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: rescue-ai-detection

rescue-ai-nav-engine:
  enabled: true
  image:
    repository: ghcr.io/ykvnkm/rescue-ai-nav-engine
    tag: latest
  imagePullSecrets:
    - name: ghcr-pull
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # HPA отключён: нагрузка nav-engine упирается в темп кадров (6 fps);
  # хранение состояния сессии (per mission_id) делает горизонтальное
  # масштабирование неочевидным.
  networkPolicy:
    enabled: true

rescue-ai-sync-worker:
  enabled: false

# batch-exporter и Airflow переехали в umbrella rescue-batch
# (namespace rescue-batch). См. infra/k8s/values/rescue-batch-cloud.yaml.
rescue-ai-batch-exporter:
  enabled: false

postgresql:
  enabled: false
minio:
  enabled: false
vault:
  # В cloud-кластере Vault уже развёрнут отдельным релизом
  # (production-режим, реальный init + unseal). Аннотации Vault
  # Agent Injector в подах работают вне зависимости от того, кем
  # был установлен сам Vault.
  enabled: false

# Apache Airflow вынесен в отдельный umbrella rescue-batch
# (см. infra/k8s/values/rescue-batch-cloud.yaml и
# infra/k8s/charts/rescue-batch/). Здесь оставлен только маркер
# выключения, чтобы umbrella rescue-ai случайно не пытался его
# поднять при перекатке.
airflow:
  enabled: false
