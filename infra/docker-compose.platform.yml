# ── АРХИВНЫЙ ФАЙЛ ─────────────────────────────────────────────────
#
# Этот compose-файл был отдельным «платформенным» стеком, поднимавшим
# Airflow рядом с прикладным стеком. После рефакторинга P1 контур
# Airflow интегрирован в корневой docker-compose.yml (сервисы
# airflow-init, airflow-webserver, airflow-scheduler).
#
# Файл оставлен на случай, если в проде понадобится разделить
# жизненные циклы платформы и приложения. Для локальной разработки
# и для дипломного стенда использовать его не нужно — всё запускается
# одной командой `docker compose up -d` из корня репозитория.
#
# Чтобы поднять платформу отдельно (исторический сценарий):
#   cd infra
#   cp platform.env.example platform.env
#   docker compose -f docker-compose.platform.yml --env-file platform.env up -d

name: rescue-platform-archive

services:
  noop:
    image: alpine:3
    command: ["sh", "-c", "echo 'this file is archived; use root docker-compose.yml'"]
    restart: "no"
